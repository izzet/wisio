# Tuned for Streamlit Community Cloud: ~1GB of memory guaranteed, 2.7GB and
# 2 CPU cores at most.
#
# The analyzer costs a fixed ~620MB before it sees any data, and roughly 100MB
# more per MB of uploaded trace, so the default 200MB upload cap is around two
# orders of magnitude larger than the memory available to process it. 16MB
# leaves headroom under the 2.7GB ceiling while staying useful for a real trace.
# streamlit_app.py enforces the same figure across all files in one submission,
# since this setting applies per file.
[server]
maxUploadSize = 16
